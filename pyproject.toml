[build-system]
requires = ["flit_core==4.1.0"]
build-backend = "flit_core.buildapi"

[project]
name = "shell-trap-lint"
version = "0.1.0"
description = "Lint shell EXIT traps that let a run that stopped short exit 0, or a failed teardown fail a test."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Curlew Labs" }]
# The python3 the current Ubuntu hosted runner image ships; the package's
# __init__ refuses anything older with a message.
requires-python = ">=3.12"
# Nothing from PyPI: the package runs on the standard library, plus shfmt on
# PATH, which parses the shell.
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Unix Shell",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
shell-trap-lint = "shell_trap_lint.cli:main"

[project.urls]
Repository = "https://github.com/curlewlabs-com/shell-trap-lint"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
